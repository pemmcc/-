name: Secure Windows Build V3

on:
  pull_request:
    types: [opened]
    paths:
      - 'secure-build-trigger-v3.txt'

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Secure handshake, decrypt and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $branch = '${{ github.head_ref }}'
          $secureDir = Join-Path $env:GITHUB_WORKSPACE 'secure-build-v3'
          New-Item -ItemType Directory -Force -Path $secureDir | Out-Null

          $rsa = [System.Security.Cryptography.RSA]::Create(4096)
          $publicBytes = $rsa.ExportSubjectPublicKeyInfo()
          [System.IO.File]::WriteAllText((Join-Path $secureDir 'public-key.b64'), [Convert]::ToBase64String($publicBytes))
          [System.IO.File]::WriteAllText((Join-Path $secureDir 'run-id.txt'), $env:GITHUB_RUN_ID)

          git config user.name 'secure-build-bot'
          git config user.email 'secure-build-bot@users.noreply.github.com'
          git add secure-build-v3/public-key.b64 secure-build-v3/run-id.txt
          git commit -m 'Secure build v3 handshake'
          git push origin "HEAD:$branch"

          $deadline = (Get-Date).AddMinutes(30)
          do {
            Start-Sleep -Seconds 5
            git pull --rebase origin $branch
            $manifest = Join-Path $secureDir 'manifest.txt'
            $keyFile = Join-Path $secureDir 'key.b64'
            $nonceFile = Join-Path $secureDir 'nonce.b64'
            $tagFile = Join-Path $secureDir 'tag.b64'
            $chunkDir = Join-Path $secureDir 'chunks'
            $ready = (Test-Path $manifest) -and (Test-Path $keyFile) -and
                     (Test-Path $nonceFile) -and (Test-Path $tagFile) -and
                     (Test-Path $chunkDir)
          } while (-not $ready -and (Get-Date) -lt $deadline)

          if (-not $ready) { throw 'Encrypted payload was not received.' }

          $expectedChunks = [int]((Get-Content $manifest -Raw).Trim())
          $chunkFiles = @(Get-ChildItem -Path $chunkDir -Filter '*.b64' | Sort-Object Name)
          if ($chunkFiles.Count -ne $expectedChunks) {
            throw "Expected $expectedChunks encrypted chunks, found $($chunkFiles.Count)."
          }

          $payloadBuilder = [System.Text.StringBuilder]::new()
          foreach ($chunk in $chunkFiles) {
            [void]$payloadBuilder.Append((Get-Content $chunk.FullName -Raw).Trim())
          }

          $encryptedKey = [Convert]::FromBase64String((Get-Content $keyFile -Raw).Trim())
          $aesKey = $rsa.Decrypt($encryptedKey, [System.Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)
          $nonce = [Convert]::FromBase64String((Get-Content $nonceFile -Raw).Trim())
          $tag = [Convert]::FromBase64String((Get-Content $tagFile -Raw).Trim())
          $cipher = [Convert]::FromBase64String($payloadBuilder.ToString())
          $plain = New-Object byte[] $cipher.Length
          $aes = [System.Security.Cryptography.AesGcm]::new($aesKey, 16)
          $aes.Decrypt($nonce, $cipher, $tag, $plain, $null)
          $aes.Dispose()

          $archivePath = Join-Path $env:RUNNER_TEMP 'source.tar.xz'
          [System.IO.File]::WriteAllBytes($archivePath, $plain)
          $sourceRoot = Join-Path $env:RUNNER_TEMP 'source-root'
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw '7-Zip is not available on the runner.' }
          & $sevenZip x $archivePath "-o$env:RUNNER_TEMP" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract xz layer.' }
          $tarPath = Join-Path $env:RUNNER_TEMP 'source.tar'
          & $sevenZip x $tarPath "-o$sourceRoot" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract tar layer.' }

          $project = Get-ChildItem -Path $sourceRoot -Recurse -Filter '*.csproj' | Select-Object -First 1
          if (-not $project) { throw 'No csproj found in decrypted payload.' }

          $publishDir = Join-Path $env:RUNNER_TEMP 'publish'
          $logPath = Join-Path $env:GITHUB_WORKSPACE 'build-log.txt'
          dotnet restore $project.FullName 2>&1 | Tee-Object -FilePath $logPath
          if ($LASTEXITCODE -ne 0) { throw 'dotnet restore failed.' }

          dotnet publish $project.FullName `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $publishDir 2>&1 | Tee-Object -FilePath $logPath -Append
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }

          $artifactZip = Join-Path $env:GITHUB_WORKSPACE 'AutoboxRepairTool-win-x64.zip'
          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $artifactZip -Force

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoboxRepairTool-win-x64
          path: |
            AutoboxRepairTool-win-x64.zip
            build-log.txt
          if-no-files-found: warn
          retention-days: 1
